<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Youth Technology House Game Days</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,800&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --slate:#262a35; --lilac:#c4a7f2; --lilac-d:#8f6bd6; --orange:#ff6b3d; --white:#fbf8ff;
  --photo-opacity:.42; /* ← règle ici la visibilité de la photo */
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 40%,#3b3552,var(--slate) 70%) fixed;color:var(--white);font-family:'Outfit',system-ui,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;background:url(photo.png) center 20%/cover no-repeat;opacity:0;transition:opacity 2s ease;animation:drift 24s ease-in-out infinite alternate}
body.open #bg{opacity:var(--photo-opacity)}
@keyframes drift{from{transform:scale(1.04)}to{transform:scale(1.12) translateY(-1.5%)}}
#veil{position:fixed;inset:0;z-index:1;opacity:0;transition:opacity 2s ease;background:radial-gradient(ellipse at 50% 55%,rgba(38,42,53,.15),rgba(38,42,53,.78) 85%),linear-gradient(180deg,rgba(38,42,53,.55),rgba(38,42,53,.2) 40%,rgba(38,42,53,.8))}
body.open #veil{opacity:1}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
section{position:relative;z-index:3;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.25rem}
/* ---------- page 1 ---------- */
#gate{transition:opacity .7s,transform .9s cubic-bezier(.7,0,.3,1);gap:1.4rem}
#gate h1{font:italic 800 clamp(2rem,7vw,3.6rem)/1.05 'Fraunces',Georgia,serif;margin:0;max-width:14ch;text-shadow:0 4px 30px rgba(0,0,0,.5)}
#join{position:relative;border:0;cursor:pointer;font:600 1.15rem 'Outfit',sans-serif;color:#1d1730;background:linear-gradient(135deg,var(--lilac),#e2d3ff);padding:1.1rem 2.4rem;border-radius:999px;box-shadow:0 10px 40px rgba(196,167,242,.45);animation:pulse 2.2s infinite;transition:transform .2s}
#join:hover{transform:scale(1.06)}
#join:active{transform:scale(.96)}
#join:focus-visible,#blow:focus-visible,#music:focus-visible{outline:3px solid var(--orange);outline-offset:4px}
#join.done{animation:none;background:linear-gradient(135deg,#ffb08f,var(--orange))}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(196,167,242,.7),0 10px 40px rgba(196,167,242,.4)}70%{box-shadow:0 0 0 26px rgba(196,167,242,0),0 10px 40px rgba(196,167,242,.4)}100%{box-shadow:0 0 0 0 rgba(196,167,242,0),0 10px 40px rgba(196,167,242,.4)}}
body.open #gate{opacity:0;transform:scale(1.4);pointer-events:none;position:absolute;inset:0}
/* ---------- page 2 ---------- */
#wish{display:none;gap:1.1rem}
body.open #wish{display:flex}
.hb{font:600 clamp(1.1rem,3.6vw,1.6rem) 'Outfit',sans-serif;letter-spacing:.04em;margin:0;opacity:0;animation:rise .9s .3s forwards}
.name{font:italic 800 clamp(3.6rem,17vw,9rem)/1 'Fraunces',Georgia,serif;margin:0;display:flex;flex-wrap:wrap;justify-content:center;color:var(--white);text-shadow:0 6px 40px rgba(0,0,0,.55),0 0 60px rgba(196,167,242,.5)}
.name span{display:inline-block;opacity:0;transform:translateY(80px) rotate(-12deg) scale(.4);animation:pop .8s cubic-bezier(.3,1.6,.5,1) forwards,wave 3s ease-in-out infinite}
.name span:nth-child(odd){color:var(--lilac)}
.name span:nth-child(4n){color:var(--orange)}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes wave{0%,100%{translate:0 0}50%{translate:0 -10px}}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.msg{max-width:34ch;min-height:7.5em;font-size:clamp(1.05rem,3.2vw,1.35rem);line-height:1.55;margin:.4rem 0;padding:1.1rem 1.4rem;border-radius:22px;background:rgba(38,42,53,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(196,167,242,.35);text-shadow:0 1px 8px rgba(0,0,0,.5)}
.msg::after{content:'|';color:var(--orange);animation:blink .8s steps(1) infinite}
.msg.end::after{display:none}
@keyframes blink{50%{opacity:0}}
.cake{width:150px;height:auto;filter:drop-shadow(0 12px 24px rgba(0,0,0,.5));opacity:0;animation:rise .9s 2s forwards}
.flame{transform-origin:50% 100%;animation:flick .35s ease-in-out infinite alternate;transform-box:fill-box}
.flame:nth-of-type(2){animation-delay:.1s}.flame:nth-of-type(3){animation-delay:.2s}
@keyframes flick{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.85,1.15) rotate(4deg)}}
.cake.out .flame{animation:none;opacity:0;transition:opacity .4s}
#blow{border:2px solid var(--orange);background:rgba(255,107,61,.15);color:var(--white);font:600 1rem 'Outfit',sans-serif;padding:.8rem 1.6rem;border-radius:999px;cursor:pointer;opacity:0;animation:rise .9s 2.4s forwards;transition:background .2s}
#blow:hover{background:var(--orange)}
#music{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:8;border:0;width:46px;height:46px;border-radius:50%;background:rgba(38,42,53,.7);color:var(--white);font-size:1.3rem;cursor:pointer;display:none}
body.open #music{display:block}
.balloon{position:fixed;bottom:-140px;z-index:4;width:54px;height:68px;border-radius:50% 50% 48% 48%;pointer-events:none;animation:up linear forwards,sway ease-in-out infinite alternate;opacity:.92}
.balloon::before{content:'';position:absolute;left:50%;bottom:-8px;border:6px solid transparent;border-bottom-color:inherit;transform:translateX(-50%);border-top:0}
.balloon::after{content:'';position:absolute;left:50%;top:100%;width:1px;height:60px;background:rgba(255,255,255,.5)}
@keyframes up{to{bottom:115vh}}
@keyframes sway{from{margin-left:-24px}to{margin-left:24px}}
.foot{margin:0;font-size:.95rem;color:#e8defa;opacity:0;animation:rise 1s 3s forwards}
@media(prefers-reduced-motion:reduce){#bg,.name span,.flame,#join{animation-duration:.01s;animation-iteration-count:1}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div><div id="veil"></div>
<canvas id="fx"></canvas>
<button id="music" aria-label="Activer ou couper la musique" title="Musique">♪</button>

<section id="gate">
  <h1>Youth Technology House Game Days…</h1>
  <button id="join">Je m'inscris à l'événement</button>
</section>

<section id="wish">
  <p class="hb">Joyeux anniversaire</p>
  <h2 class="name" id="name" aria-label="Ma déesse de la beauté"></h2>
  <p class="msg" id="msg" aria-live="polite"></p>
  <svg class="cake" id="cake" viewBox="0 0 150 140" aria-hidden="true">
    <ellipse cx="75" cy="128" rx="68" ry="9" fill="#14161d" opacity=".5"/>
    <rect x="14" y="88" width="122" height="38" rx="10" fill="#8f6bd6"/>
    <path d="M14 98q10 12 20 0t20 0 20 0 20 0 20 0 22 0v-2H14z" fill="#e2d3ff"/>
    <rect x="34" y="58" width="82" height="34" rx="9" fill="#c4a7f2"/>
    <path d="M34 68q10 11 20 0t20 0 20 0 22 0v-2H34z" fill="#fbf8ff"/>
    <g fill="#ff6b3d"><rect x="52" y="38" width="8" height="22" rx="2"/><rect x="71" y="34" width="8" height="26" rx="2"/><rect x="90" y="38" width="8" height="22" rx="2"/></g>
    <path class="flame" d="M56 36c-6-8 0-14 0-18 5 4 6 12 0 18z" fill="#ffd166"/>
    <path class="flame" d="M75 32c-6-8 0-14 0-18 5 4 6 12 0 18z" fill="#ffd166"/>
    <path class="flame" d="M94 36c-6-8 0-14 0-18 5 4 6 12 0 18z" fill="#ffd166"/>
  </svg>
  <button id="blow">Faire un vœu et souffler les bougies</button>
  <p class="foot">Avec toute mon affection, pour ta journée.</p>
  <p class="foot">Fais avec amour pou toi, Emmanuel</p>
</section>

<script>
(function(){
const $=s=>document.querySelector(s);
const cv=$('#fx'),ctx=cv.getContext('2d');let W,H,P=[];
function size(){const d=devicePixelRatio||1;W=cv.width=innerWidth*d;H=cv.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}
size();addEventListener('resize',size);
const COL=['#c4a7f2','#ff6b3d','#fbf8ff','#ffd166','#8f6bd6'];
function confetti(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=4+Math.random()*9;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,g:.22,w:5+Math.random()*7,h:3+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:COL[i%5],life:150+Math.random()*60,t:0})}}
function firework(x,y){const c=COL[Math.floor(Math.random()*5)];for(let i=0;i<70;i++){const a=i/70*Math.PI*2,v=2+Math.random()*4.5;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.06,w:3,h:3,r:0,vr:0,c,life:70+Math.random()*30,t:0,s:1})}}
function rain(){for(let i=0;i<4;i++)P.push({x:Math.random()*innerWidth,y:-10,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.01,w:6,h:4,r:0,vr:.1,c:COL[i%5],life:300,t:0})}
function loop(){ctx.clearRect(0,0,innerWidth,innerHeight);
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.t++;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=p.s?.985:.995;p.r+=p.vr;
  if(p.t>p.life||p.y>innerHeight+30){P.splice(i,1);continue}
  ctx.globalAlpha=Math.min(1,(p.life-p.t)/40);ctx.fillStyle=p.c;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);
  if(p.s){ctx.beginPath();ctx.arc(0,0,p.w/2,0,7);ctx.fill()}else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}
 ctx.globalAlpha=1;requestAnimationFrame(loop)}
loop();

/* ---- musique (Joyeux anniversaire, synthétisé) ---- */
let ac,playing=false,timer;
const N={C:261.6,D:293.7,E:329.6,F:349.2,G:392,A:440,B:493.9,C2:523.3,D2:587.3,E2:659.3,F2:698.5,G2:784};
const tune=[['G',.75],['G',.25],['A',1],['G',1],['C2',1],['B',2],['G',.75],['G',.25],['A',1],['G',1],['D2',1],['C2',2],['G',.75],['G',.25],['G2',1],['E2',1],['C2',1],['B',1],['A',1],['F2',.75],['F2',.25],['E2',1],['C2',1],['D2',1],['C2',2]];
function playTune(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();let t=ac.currentTime+.1;const b=.42;
 tune.forEach(([n,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=N[n];o.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d*b);o.start(t);o.stop(t+d*b+.05);t+=d*b});
 return (t-ac.currentTime)*1000+800}
function loopMusic(){if(!playing)return;timer=setTimeout(loopMusic,playTune())}
function toggleMusic(on){playing=on;clearTimeout(timer);$('#music').textContent=on?'♪':'🔇';if(on)loopMusic()}
$('#music').onclick=()=>toggleMusic(!playing);

/* ---- étapes ---- */
const nm=$('#name');[...'Ma déesse de la Beauté'].forEach((ch,i)=>{const s=document.createElement('span');s.textContent=ch;s.style.animationDelay=(.6+i*.12)+'s,'+(1.8+i*.15)+'s';nm.appendChild(s)});
const text="Aujourd'hui, c'est ton jour. Que cette nouvelle année t'apporte de la joie, de la lumière et tout ce que ton cœur désire. Merci d'être la personne que tu es. Fais un vœu…";
let ballTimer;
function balloons(){const b=document.createElement('div');b.className='balloon';const c=COL[Math.floor(Math.random()*5)];b.style.background=c;b.style.borderBottomColor=c;b.style.color=c;
 b.style.left=(Math.random()*92)+'vw';const s=.7+Math.random()*.8;b.style.transform='scale('+s+')';b.style.animationDuration=(9+Math.random()*7)+'s,'+(2+Math.random()*2)+'s';
 document.body.appendChild(b);setTimeout(()=>b.remove(),17000)}
function type(){const m=$('#msg');let i=0;(function step(){m.textContent=text.slice(0,++i);if(i<text.length)setTimeout(step,38);else m.classList.add('end')})()}
$('#join').onclick=function(e){
 const r=this.getBoundingClientRect();this.classList.add('done');this.textContent='Inscription confirmée ✓';
 confetti(r.left+r.width/2,r.top+r.height/2,90);
 setTimeout(()=>{document.body.classList.add('open');scrollTo(0,0);toggleMusic(true);
  confetti(innerWidth*.2,innerHeight*.7,110);confetti(innerWidth*.8,innerHeight*.7,110);
  setTimeout(()=>firework(innerWidth*.3,innerHeight*.25),700);setTimeout(()=>firework(innerWidth*.72,innerHeight*.2),1200);
  setTimeout(type,1700);for(let i=0;i<6;i++)setTimeout(balloons,i*350);ballTimer=setInterval(balloons,1100);setInterval(rain,260)},1100)};
$('#blow').onclick=function(){$('#cake').classList.add('out');this.textContent='Que ce vœu se réalise 💜';this.disabled=true;
 const R=$('#cake').getBoundingClientRect();confetti(R.left+R.width/2,R.top,160);
 [0,300,600,900,1300].forEach(d=>setTimeout(()=>firework(innerWidth*(.15+Math.random()*.7),innerHeight*(.12+Math.random()*.4)),d))};
addEventListener('pointerdown',e=>{if(document.body.classList.contains('open')&&!e.target.closest('button'))confetti(e.clientX,e.clientY,40)});
})();
</script>
</body>
</html>
